[package]
name = "ct"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "ct"
crate-type = ["cdylib", "rlib"]

[dependencies]
ct-net = { path = "../ct-net" }
egui = "0.35"
egui-directx11 = "0.13.0"
retour = "0.3"
unsafe-libopus = "0.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory"] }
